[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "r60a"
version = "0.1.0"
description = "Read and log MicRadar R60A-series 60 GHz mmWave radar data over a USB-TTL link"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
rich = ["rich>=13.0"]
analysis = ["pandas>=2.0"]
dev = ["pytest>=8.0"]

[project.scripts]
r60a-record = "r60a.record:main"
r60a-recorder = "r60a.recorder:main"
r60a-visualize = "r60a.visualize:main"

[tool.setuptools]
packages = ["r60a"]

[tool.setuptools.package-data]
r60a = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
